; ==============================================================================
; Emergency Security Mitigation: PHP2Shell (CVE-2026-109618 & CVE-2026-109619)
; ==============================================================================
; Nonaktifkan fitur session upload progress di level engine PHP.
; Celah PHP2Shell mengeksploitasi parsing multipart request dan tracking upload progress.
session.upload_progress.enabled = 0

; Batasi ukuran file upload & post data untuk mencegah memory exhaustion / OOM
upload_max_filesize = 8M
post_max_size = 8M
memory_limit = 256M
